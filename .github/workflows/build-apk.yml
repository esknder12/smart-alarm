name: Build APK

on:
  # Manual runs: Actions -> "Build APK" -> Run workflow (pick release or debug).
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Gradle variant to assemble'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # Capacitor 8's CLI declares "engines": { "node": ">=22.0.0" }.
          node-version: '22'
          cache: 'npm'

      - name: Install web dependencies
        run: npm ci

      # Runtime harness for the strict volume lock, including the JS <-> native
      # hardware-button-lock contract (against a fake plugin).
      - name: Run web tests
        run: npm test

      - name: Build the web bundle
        run: npm run build

      # Capacitor 8's Android library compiles with Java 21 source/target,
      # so JDK 17 fails with "invalid source release: 21".
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      # Recreates the git-ignored Capacitor glue (cordova plugin module,
      # copied web assets, capacitor.config.json) and refreshes plugins.
      # --no-install keeps it on the CLI pinned by package-lock.json instead of
      # letting npx resolve a different version from the registry.
      - name: Sync the web bundle into the Android project
        run: npx --no-install cap sync android

      - name: Restore the release signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ]; then
            mkdir -p android/signing
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/signing/niqu.keystore
            {
              echo "storeFile=signing/niqu.keystore"
              echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
              echo "keyAlias=${ANDROID_KEY_ALIAS:-niqu}"
              echo "keyPassword=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
              echo "storeType=JKS"
            } > android/signing/keystore.properties
            echo "Release APK will be signed with alias '${ANDROID_KEY_ALIAS:-niqu}'."
          else
            echo "::warning::Signing secrets are not set, so the APK is built with the debug key. Add ANDROID_KEYSTORE_BASE64 (+ ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) to ship a signed release APK."
          fi

      - name: Android SDK environment
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          {
            echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
            echo "sdk dir: $SDK"
            echo "sdk contents: $(ls -1 "$SDK" 2>&1 | tr '\n' ' ')"
            echo "platforms: $(ls -1 "$SDK/platforms" 2>&1 | tr '\n' ' ')"
            echo "build-tools: $(ls -1 "$SDK/build-tools" 2>&1 | tr '\n' ' ')"
          } | while IFS= read -r line; do echo "::notice::$line"; done

      # Plain-JVM tests (no emulator) for the native hardware-button lock: which keys
      # are swallowed, lease expiry, counters. Sources: android/app/src/test.
      - name: Run native unit tests
        id: unit_tests
        run: |
          set -o pipefail
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest 2>&1 | tee gradle.log

      # Surfaces the test counts as an annotation, and fails if Gradle ran no tests at all
      # (a green test task with "NO-SOURCE" would otherwise look exactly like success).
      - name: Summarise native unit tests
        if: always() && steps.unit_tests.outcome != 'skipped'
        run: |
          set -uo pipefail
          python3 - android/app/build/test-results/testDebugUnitTest <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          files = glob.glob(sys.argv[1] + '/*.xml')
          tests = failures = errors = skipped = 0
          for path in files:
              root = ET.parse(path).getroot()
              tests += int(root.get('tests', 0))
              failures += int(root.get('failures', 0))
              errors += int(root.get('errors', 0))
              skipped += int(root.get('skipped', 0))
          if not files or tests == 0:
              print('::error::No native unit tests ran - check android/app/src/test')
              sys.exit(1)
          print(f'::notice::Native unit tests: {tests} run, {failures} failed, {errors} errors, {skipped} skipped ({len(files)} classes)')
          # A failing JVM test is only a count in the log; name the failing cases so the run page
          # says which assertion broke without downloading anything.
          shown = 0
          for path in files:
              root = ET.parse(path).getroot()
              for case in root.iter('testcase'):
                  bad = [c for c in case if c.tag in ('failure', 'error')]
                  if not bad:
                      continue
                  message = ' '.join((bad[0].get('message') or bad[0].text or '').split())
                  cls = case.get('classname', '').split('.')[-1]
                  if shown < 25:
                      print(f'::error::FAILED {cls}.{case.get("name")} - {message[:220]}')
                  shown += 1
          if shown > 25:
              print(f'::error::...and {shown - 25} more failing tests')
          sys.exit(1 if failures or errors else 0)
          PY

      - name: Assemble the APK
        id: assemble
        run: |
          set -o pipefail
          cd android
          chmod +x gradlew
          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee gradle.log
          else
            ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee gradle.log
          fi

      # The interesting part of a Gradle failure is echoed as job annotations so
      # it is readable straight from the run without downloading the full log.
      - name: Report the Gradle failure
        if: failure() && (steps.unit_tests.outcome == 'failure' || steps.assemble.outcome == 'failure')
        run: |
          set -uo pipefail
          if [ ! -f android/gradle.log ]; then
            echo "::error::Gradle produced no log file"
            exit 0
          fi
          awk '/What went wrong:/{f=1} f {print "::error::" $0} f && /^\* Try:/{exit}' android/gradle.log | head -30
          grep -i -m 12 -E 'SDK location|licen[cs]es|Could not (find|resolve|download)|Unsupported class file|minimum supported|No matching variant|Could not determine' android/gradle.log \
            | while IFS= read -r line; do echo "::error::$line"; done

      - name: Locate the APK
        id: apk
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::No APK was produced under android/app/build/outputs/apk"
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"
          {
            echo "## Build APK"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Variant | \`${BUILD_TYPE}\` |"
            echo "| Artifact | \`$(basename "$APK")\` |"
            echo "| Size | $(du -h "$APK" | cut -f1) |"
            echo "| SHA-256 | \`$(sha256sum "$APK" | cut -d' ' -f1)\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: niqu-${{ env.BUILD_TYPE }}-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30
